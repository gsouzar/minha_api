name: Python application

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Testando o Codigo
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
       
    - name: Executar o pytest no projeto
      run: |
        PYTHONPATH=. pytest tests/ -v --tb=short
  
 Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Docker Login
        uses: docker/login-action@v4.1.0
        with:
           username: ${{secrets.DOCKER_USER}}
           password: ${{secrets.DOCKER_PWD}}

      - name: Configurar o Docker na VM
        uses: docker/build-push-action@v7.1.0
        with:
          push: true
          tags: |
              gsouzar/minha_api_ta:latest
              gsouzar/minha_api_ta:${{github.sha}}
          
    DEPLOY:
      name: Implemnetando na EC2
      runs-on: ubuntu-latest
      needs: Image

      steps:
       - name: Deploy na EC2 via SSH
         uses: appleboy/ssh-action@1.0.3
         with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_KEY}}
          script: |
           #TESTE DE ACESSO
           echo "ACESSO LIBERADO"
         
